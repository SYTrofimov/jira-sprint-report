packages: []
allowBuilds:
  unrs-resolver: false
minimumReleaseAge: 10080
# Allow urgent security patches before the 7-day cooldown (e.g. axios GHSA-3p68-rc4w-qgx5).
minimumReleaseAgeExclude:
  # GHSA-q2hr-2g5m-vwhr / GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p.
  - brace-expansion@1.1.21 || 2.1.7 || 5.0.12
  - axios
  - follow-redirects
  - form-data
  - '@babel/core'
  - js-yaml
overrides:
  # GHSA-p498-v437-472g: prevent recursive copies from following symlinked files.
  '@humanfs/node@<0.16.8': 0.17.0
  # GHSA-73wf-gq98-2v4g: reject vulnerable Browserslist releases while
  # preserving the consumer's compatible 4.x line.
  'browserslist@<=4.28.6': ^4.28.7
  '@babel/core': 8.0.6
  js-yaml: 4.3.2
  form-data: 4.0.6
  follow-redirects: ^1.16.0
  # GHSA (brace-expansion DoS): scoped per major so each consumer keeps
  # its own major line.
  'brace-expansion@>=3.0.0 <5.0.12': ^5.0.12
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': ^2.1.7
